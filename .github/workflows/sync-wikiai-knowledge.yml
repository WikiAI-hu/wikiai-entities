name: Mirror WikiAI organizational knowledge from WordPress

on:
  workflow_dispatch:
  schedule:
    - cron: '15 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/scripts/sync-wikiai-knowledge.py'
      - '.github/scripts/test_sync_wikiai_knowledge.py'
      - '.github/workflows/sync-wikiai-knowledge.yml'
      - 'wikiai/manifest.json'
      - 'wikiai/index.md'
      - 'wikiai/people/*.md'

permissions:
  contents: write

concurrency:
  group: wikiai-organizational-knowledge-mirror
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact HTML-to-Markdown dependency
        run: python -m pip install markdownify==1.2.3
      - name: Test dynamic personnel and safety rules
        run: python -m unittest discover -s .github/scripts -p 'test_sync_wikiai_knowledge.py' -v
      - name: Synchronize live published WordPress pages
        run: python .github/scripts/sync-wikiai-knowledge.py
      - name: Enforce knowledge manifest integrity
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("wikiai/manifest.json").read_text(encoding="utf-8"))
          p=m.get("people",[])
          assert len(m.get("documents",[]))==5, "WikiAI core documents are incomplete"
          assert p, "Published personnel index unexpectedly empty"
          i=Path("wikiai/index.md").read_text(encoding="utf-8")
          for x in list(m.get("documents",[]))+p:
              assert Path(x["path"]).is_file(), "Missing Markdown mirror "+x["path"]
          for person in p:
              expected="(people/"+Path(person["path"]).name+")"
              assert expected in i, "Missing published person from index: "+expected
          assert len({x["wordpress_post_id"] for x in p})==len(p), "Duplicate WordPress profile"
          print("Knowledge manifest verified:",len(m["documents"]),"core pages and",len(p),"published people")
          PY
      - name: Validate published phone priorities in WordPress knowledge mirror
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for path in ("wikiai/about.md", "wikiai/contact.md"):
              body = Path(path).read_text(encoding="utf-8")
              low = body.lower()
              assert "70 226 4545" in body, f"Primary public phone missing: {path}"
              assert "70 778 4012" in body, f"Secondary public phone missing: {path}"
              assert "elsődleges mobil" in low and "másodlagos mobil" in low, (
                  f"Explicit phone priority missing: {path}")
              assert low.index("elsődleges mobil") < low.index("másodlagos mobil"), (
                  f"Phone priority order wrong: {path}")
              print("PASS public first-party phone hierarchy:", path)
          PY
      - name: Commit validated WordPress knowledge mirrors
        shell: bash
        run: |
          git add -A -- wikiai/index.md wikiai/manifest.json wikiai/knowledge-sync-state.json wikiai/knowledge-sync-status.json \
            wikiai/services.md wikiai/pricing.md wikiai/about.md wikiai/team.md wikiai/contact.md wikiai/people/
          if git diff --cached --quiet; then
            echo 'Knowledge mirrors already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Mirror current WikiAI pages and active expert profiles'
          for retry in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Remote updated concurrently; retry $retry from latest main"
            git fetch origin main
            git reset --hard origin/main
            python .github/scripts/sync-wikiai-knowledge.py
            git add -A -- wikiai/index.md wikiai/manifest.json wikiai/knowledge-sync-state.json wikiai/knowledge-sync-status.json \
              wikiai/services.md wikiai/pricing.md wikiai/about.md wikiai/team.md wikiai/contact.md wikiai/people/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Mirror current WikiAI pages and active expert profiles'
          done
          echo 'Could not push knowledge mirrors without conflict' >&2
          exit 1

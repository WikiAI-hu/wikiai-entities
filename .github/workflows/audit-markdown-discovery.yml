name: Audit live WikiAI HTML Markdown links

on:
  workflow_dispatch:
  schedule:
    - cron: '29 4 * * *'
  push:
    branches: [main]
    paths:
      - 'wordpress/snippets/wikiai-markdown-head-discovery.php'
      - '.github/workflows/audit-markdown-discovery.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check all published knowledge and business HTML heads
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          RAW = "https://raw.githubusercontent.com/WikiAI-hu/wikiai-entities/main/"

          class HeadLinks(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.head = False
                  self.links = []
              def handle_starttag(self, tag, attrs):
                  if tag == "head":
                      self.head = True
                  if tag == "link" and self.head:
                      self.links.append(dict(attrs))
              def handle_endtag(self, tag):
                  if tag == "head":
                      self.head = False

          def inspect(item):
              url, relpath = item
              req = Request(url, headers={
                  "User-Agent": "WikiAI-Markdown-Discovery-Audit/1.0",
                  "Accept": "text/html",
                  "Cache-Control": "no-cache",
              })
              with urlopen(req, timeout=35) as response:
                  html = response.read(4_000_001)
                  if response.status != 200:
                      raise ValueError("Unexpected HTTP status "+str(response.status))
                  if len(html) > 4_000_000:
                      raise ValueError("HTML exceeds 4MB limit")
                  resolved = urlsplit(response.geturl())
                  if resolved.scheme != "https" or resolved.netloc != "www.wikiai.hu" or resolved.path != urlsplit(url).path:
                      raise ValueError("Untrusted redirect")
                  if "html" not in response.headers.get("Content-Type","").lower():
                      raise ValueError("Response not HTML")
              parser = HeadLinks()
              parser.feed(html.decode("utf-8", "replace"))
              wanted = RAW+relpath
              exact = [x for x in parser.links
                       if x.get("href")==wanted
                       and x.get("type","").lower()=="text/markdown"
                       and "alternate" in x.get("rel","").split()]
              if len(exact) != 1:
                  others = [x.get("href") for x in parser.links if x.get("type","").lower()=="text/markdown"]
                  raise ValueError("Expected one GitHub Markdown alternate, got "+str(len(exact))+"; other alternates: "+str(others[:4]))
              own = [x.get("href") for x in parser.links if x.get("type","").lower()=="text/markdown"
                     and x.get("href","").startswith("https://www.wikiai.hu/")]
              return {"url":url, "path":relpath, "own_markdown_links":len(own)}

          k = json.loads(Path("wikiai/manifest.json").read_text(encoding="utf-8"))
          e = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          targets = [(x["canonical_url"],x["path"]) for x in k["documents"]+k["people"]]
          targets += [(x["canonical_url"],x["machine_record"]) for x in e["entities"] if x.get("status")=="published"]
          if len(targets)<20:
              raise RuntimeError("Suspiciously incomplete set of profiles")
          output = []
          errors = []
          with ThreadPoolExecutor(max_workers=5) as pool:
              jobs = {pool.submit(inspect, item):item for item in targets}
              for task in as_completed(jobs):
                  try:
                      result=task.result()
                      output.append(result)
                      print("OK",result["url"],result["path"],"own-domain links",result["own_markdown_links"])
                  except Exception as exc:
                      url,_=jobs[task]
                      errors.append((url,str(exc)))
                      print("FAIL",url,str(exc),file=sys.stderr)
          print("SUMMARY",len(output),"/",len(targets),"pages passed; own-domain Markdown links:",sum(bool(r["own_markdown_links"]) for r in output))
          if errors:
              for url,err in errors:
                  print("FAILED",url,err,file=sys.stderr)
              sys.exit(1)
          PY

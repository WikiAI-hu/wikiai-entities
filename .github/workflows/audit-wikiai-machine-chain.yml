name: Audit WikiAI live llms and machine entity chain

on:
  workflow_dispatch:
  schedule:
    - cron: '39 5 * * *'
  push:
    branches: [main]
    paths:
      - 'wordpress/snippets/wikiai-virtual-llms-txt.php'
      - 'wordpress/snippets/wikiai-hfcm-readonly-adapter.php'
      - '.github/workflows/audit-wikiai-machine-chain.yml'

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check actual public responses from the production site
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          import sys
          import time
          from pathlib import Path
          from urllib.parse import urlparse
          from urllib.request import Request, urlopen
          from urllib.error import HTTPError, URLError

          BASE = "https://www.wikiai.hu"
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          business = [e for e in manifest["entities"] if e.get("status") == "published"
                      and e.get("canonical_url") != BASE + "/wikiai-hu/"]

          def request(path, max_bytes=4000000):
              url = BASE + path
              req = Request(url, headers={
                  "User-Agent": "WikiAI-LLMS-And-Entity-Audit/1.0",
                  "Accept": "text/html,text/plain,application/json",
                  "Cache-Control": "no-cache",
              })
              for attempt in range(4):
                  try:
                      with urlopen(req, timeout=40) as response:
                          data = response.read(max_bytes+1)
                          assert response.status == 200, f"HTTP {response.status}: {url}"
                          assert len(data) <= max_bytes, "Response exceeds safety limit"
                          assert urlparse(response.geturl()).netloc == "www.wikiai.hu", "Unexpected redirect"
                          return data.decode("utf-8", "replace"), response.headers
                  except HTTPError as exc:
                      # Authentication failures remain immediate and visible for the security checks.
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                      delay = 3 * (2 ** attempt)
                      print(f"RETRY {url}: transient HTTP {exc.code}, {delay}s", file=sys.stderr)
                      time.sleep(delay)
                  except (URLError, TimeoutError) as exc:
                      if attempt == 3:
                          raise
                      delay = 3 * (2 ** attempt)
                      print(f"RETRY {url}: {type(exc).__name__}, {delay}s", file=sys.stderr)
                      time.sleep(delay)

          problems = []
          def verify(condition, message):
              if condition:
                  print("PASS",message)
              else:
                  print("FAIL",message,file=sys.stderr)
                  problems.append(message)

          try:
              llms, llms_headers = request("/llms.txt?wikiai_live_audit=1")
              verify(llms.lstrip().startswith("# WikiAI.hu"), "The virtual llms.txt is live")
              verify("text/plain" in llms_headers.get("Content-Type",""), "Virtual llms.txt is plain text")
              verify(llms.count("WikiAI Machine Entity HTML index") == 1,
                     "Exactly one explicit /entity/ directory link in llms.txt")
              verify("https://www.wikiai.hu/entity/" in llms, "Entity index URL present")
              verify("wikiai/people/simon-imre.md" in llms, "Current published Simon Imre profile present")
              verify("wikiai/people/varhelyi-csanad.md" in llms, "Current Várhelyi Csanád profile present")
              verify("wikiai/people/varhelyi-viktoria.md" in llms, "Current Várhelyi Viktória profile present")
              verify("molnar-andras" not in llms.lower() and "molnár andrás" not in llms.lower(),
                     "Retired profile is absent")
              for entry in business:
                  slug = entry["canonical_url"].rstrip("/").split("/")[-1]
                  path = "entities/" + slug + ".jsonld"
                  verify(path in llms, f"Published business JSON-LD in llms.txt: {slug}")
              if "Warning:" in llms or "Fatal error:" in llms:
                  verify(False, "PHP warning/error must not appear in llms.txt")
          except Exception as exc:
              problems.append("Virtual llms.txt request failed: "+str(exc))
              print("FAIL",problems[-1],file=sys.stderr)

          try:
              directory, headers = request("/entity/",max_bytes=2000000)
              verify("porvadaszok-matractisztitas-debrecen.html" in directory,
                     "Machine entity directory includes Porvadászok")
              verify("europa-terv-kft-debrecen.html" in directory,
                     "Machine entity directory includes Európa Terv")
          except Exception as exc:
              problems.append("Entity directory request failed: "+str(exc))
              print("FAIL",problems[-1],file=sys.stderr)

          # Audit every current WordPress business machine HTML, including future profiles.
          from concurrent.futures import ThreadPoolExecutor, as_completed
          def test_business(entry):
              slug = entry["canonical_url"].rstrip("/").split("/")[-1]
              html, headers = request("/entity/" + slug + ".html", max_bytes=3000000)
              if len(html.encode("utf-8")) < 10000:
                  raise ValueError("Machine record is suspiciously short")
              if "application/ld+json" not in html.lower():
                  raise ValueError("Machine record lacks JSON-LD")
              if "https://www.wikiai.hu/" + slug + "/" not in html:
                  raise ValueError("Canonical business link is absent")
              return slug, len(html.encode("utf-8"))

          # Avoid a burst of concurrent checks overwhelming the WordPress host/WAF.
          with ThreadPoolExecutor(max_workers=2) as pool:
              futures = {pool.submit(test_business, item):item for item in business}
              for future in as_completed(futures):
                  slug = futures[future]["canonical_url"].rstrip("/").split("/")[-1]
                  try:
                      value = future.result()
                      verify(True, f"Deep machine HTML valid for {slug} ({value[1]} bytes)")
                  except Exception as exc:
                      verify(False, f"Machine HTML failed for {slug}: {exc}")

          for path in ["/wp-json/wikiai-hfcm/v1/list", "/wp-json/wikiai-hfcm/v1/snippet-chunk/40", "/wp-json/wikiai-hfcm-watchdog/v1/status"]:
              try:
                  request(path,max_bytes=30000)
                  problems.append("Security regression: anonymous HFCM source readable at "+path)
                  print("FAIL",problems[-1],file=sys.stderr)
              except HTTPError as exc:
                  verify(exc.code in (401,403),
                         f"Admin-only HFCM source blocked anonymously: {path} (HTTP {exc.code})")
              except Exception as exc:
                  problems.append("Cannot establish HFCM access policy: "+str(exc))
                  print("FAIL",problems[-1],file=sys.stderr)

          # Temporary source inspector must remain disabled after maintenance.
          try:
              request("/wp-json/wikiai-code-audit/v1", max_bytes=30000)
              verify(False, "Temporary Code Snippets source inspector is still reachable")
          except HTTPError as exc:
              verify(exc.code == 404, "Temporary source-inspection REST route is absent")
          except Exception as exc:
              verify(False, "Temporary source inspection route could not be checked: "+str(exc))

          summary = ["# WikiAI live machine delivery audit", "",
                     f"- Published external businesses: {len(business)}",
                     f"- Failed assertions: {len(problems)}", ""]
          summary.extend("- FAIL: "+p for p in problems)
          if not problems:
              summary.append("- All live checks passed.")
          Path("live-machine-audit-summary.md").write_text("\n".join(summary)+"\n",encoding="utf-8")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as out:
              out.write("\n".join(summary)+"\n")
          if problems:
              sys.exit(1)
          PY

      - name: Verify legal and public contact parity across HTML and machine records
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import time
          from datetime import datetime
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen

          BASE = "https://www.wikiai.hu"
          PAGES = {
              "/rolunk/": 21,
              "/kapcsolat/": 23,
              "/impresszum/": 446,
              "/adatvedelmi-tajekoztato/": 48,
              "/altalanos-szerzodesi-feltetelek/": 49,
              "/suti-tajekoztato/": 448,
              "/ai-atlathatosag-szerzoi-jogok/": 452,
              "/wikiai-hu/": 637,
              "/arak/": 202,
              "/faq/": 47,
          }
          PRIMARY = "+36702264545"
          SECONDARY = "+36707784012"

          def fetch(path):
              req = Request(BASE + path, headers={
                  "User-Agent": "WikiAI-Live-Fact-Consistency/1.0",
                  "Accept": "text/html,application/json",
                  "Cache-Control": "no-cache",
              })
              for attempt in range(4):
                  try:
                      with urlopen(req, timeout=38) as response:
                          if urlsplit(response.geturl()).netloc != "www.wikiai.hu":
                              raise RuntimeError("Unexpected redirect")
                          return response.read(4_000_001).decode("utf-8", "replace")
                  except HTTPError as exc:
                      if exc.code not in (429, 500, 502, 503, 504) or attempt == 3:
                          raise
                  except (URLError, TimeoutError):
                      if attempt == 3:
                          raise
                  time.sleep(2 ** attempt + 2)

          problems = []
          for page, post_id in PAGES.items():
              try:
                  public_html = fetch(page + "?wikiai_contact_consistency_check=1")
                  record = json.loads(fetch(
                      "/wp-content/uploads/wikiai-machine/v1/entries/post-" +
                      str(post_id) + ".json"))
                  machine_text = record.get("content_text", "").lower()
                  checks = {
                      "canonical URL": record.get("canonical_url") == BASE + page,
                      "public primary data attribute": 'data-primary-telephone="' + PRIMARY + '"' in public_html,
                      "public secondary data attribute": 'data-secondary-telephone="' + SECONDARY + '"' in public_html,
                      "public primary telephone": "tel:" + PRIMARY in public_html,
                      "public secondary telephone": "tel:" + SECONDARY in public_html,
                      "machine primary phone": "+36 70 226 4545" in machine_text,
                      "machine secondary phone": "+36 70 778 4012" in machine_text,
                      "machine labels": "elsődleges mobil" in machine_text and "másodlagos mobil" in machine_text,
                      "schema not missing": record.get("schema_status") == "ok",
                  }
                  if page == "/kapcsolat/":
                      osm_url = "https://www.openstreetmap.org/node/14303812090"
                      checks["public OpenStreetMap office link"] = osm_url in public_html
                      checks["machine OpenStreetMap office mention"] = "openstreetmap" in machine_text
                      with open("wikiai/contact.md", encoding="utf-8") as mirror_file:
                          checks["GitHub Markdown office map link"] = osm_url in mirror_file.read()
                  if page in ("/rolunk/", "/wikiai-hu/"):
                      directory_links = {
                          "Arany Oldalak": "https://aranyoldalak.hu/wikiai-hu.htm",
                          "Cylex": "https://xn--hajdszoboszl-cib3g.cylex.hu/ceg-info/wikiai-hu-1317711.html",
                          "OpenStreetMap": "https://www.openstreetmap.org/node/14303812090",
                      }
                      for source_name, source_url in directory_links.items():
                          checks["public " + source_name + " listing link"] = source_url in public_html
                          checks["machine " + source_name + " mention"] = source_name.lower() in machine_text
                      md_path = "wikiai/about.md" if page == "/rolunk/" else "entities/wikiai-hu.md"
                      with open(md_path, encoding="utf-8") as mirror_file:
                          md_text = mirror_file.read()
                      for source_name, source_url in directory_links.items():
                          checks["Markdown " + source_name + " listing link"] = source_url in md_text
                  if page == "/wikiai-hu/":
                      for source_name, source_url in {
                          "Crunchbase": "https://www.crunchbase.com/organization/wikiai-hu",
                          "Hugging Face": "https://huggingface.co/wikiaihu",
                      }.items():
                          checks["public " + source_name + " profile link"] = source_url in public_html
                          checks["Markdown " + source_name + " profile link"] = source_url in md_text
                  try:
                      generated = datetime.fromisoformat(record["generated_at"].replace("Z", "+00:00"))
                      modified = datetime.fromisoformat(record["modified_at"].replace("Z", "+00:00"))
                      checks["machine not older than published page"] = generated >= modified
                  except (ValueError, TypeError, KeyError):
                      checks["machine timestamps available"] = False
                  for label, ok in checks.items():
                      if not ok:
                          problems.append(page + ": " + label)
                          print("FAIL", page, label, file=sys.stderr)
                  if all(checks.values()):
                      print("PASS public HTML / machine parity", page)
              except Exception as exc:
                  problems.append(page + ": " + type(exc).__name__ + ": " + str(exc)[:160])
                  print("FAIL", problems[-1], file=sys.stderr)
          print("Audited", len(PAGES), "first-party pages for public HTML and machine record consistency;",
                len(problems), "failures")
          if problems:
              sys.exit(1)
          PY
